<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#002B5C" />
        <!--
            NO hardcoded <meta name="robots"> here. Seo.jsx emits `noindex, follow`
            on 404s, cart, checkout and account pages, and React 19 APPENDS head
            tags rather than replacing them — a static `index, follow` left two
            contradictory robots directives on exactly the pages we want hidden.
            Absent a robots tag, crawlers default to index/follow, so the public
            pages are unaffected.

            Every URL below names the www host. The apex 308-redirects to www, so
            an apex canonical points Google at a URL that only redirects, and some
            social scrapers will not follow a redirect when fetching og:image.
        -->
        <!--
            NO <title>, description, canonical, Open Graph or Twitter tags here.

            React 19 hoists the equivalents out of components/Seo.jsx into <head>,
            and it APPENDS rather than replaces. Static copies here therefore
            survive alongside the per-route ones, and a prerendered page would
            ship two canonicals and two titles — Google discards a page with
            conflicting canonicals outright, which is worse than the single wrong
            canonical this file used to emit.

            The trade-off, accepted knowingly: before hydration a route has no
            title, so the browser tab shows the URL for a moment and a crawler
            that executes no JavaScript sees none. Prerendering is what closes
            that gap, by baking the rendered tags into each route's HTML. Do not
            re-add a "fallback" title here — it would come back as a duplicate on
            every prerendered page.

            Only genuinely global, route-independent tags belong below.
        -->

        <!-- Icons & manifest -->
        <link rel="icon" href="/favicon.png" type="image/png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!--
          Every font the site actually uses, and nothing else.

          Public Sans carries body text, .font-serif headings (700) and
          .overline (600); the code uses 400, 500, 600 and 700 and no others,
          so 300 and 800 were two files downloaded to style nothing. Source
          Serif 4 was three more for .font-display, which no element uses. And
          this line used to load Inter 600, referenced nowhere in the app at
          all. Twelve weight files to six.

          If you add font-light or font-extrabold anywhere, add the weight
          here too — otherwise the browser will synthesise it, which looks
          subtly wrong rather than obviously broken.
        -->
        <!--
          Loaded without blocking the first paint.

          The page is prerendered, so its text is already in this HTML — the
          only thing standing between the visitor and seeing it is CSS. A
          plain stylesheet link holds paint until it arrives, which on a
          throttled mobile connection is most of a second of blank screen for
          a page whose content is right here.

          media="print" makes it non-blocking (the browser fetches it but does
          not need it to paint the screen), and onload flips it back to all.
          display=swap already meant text appeared in the fallback face first
          and swapped when the webfont landed, so what the visitor sees is
          unchanged — it just starts sooner.
        -->
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            media="print"
            onload="this.media='all'; this.onload=null;"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            />
        </noscript>

        <!-- The homepage LCP image comes from here. Without this the browser
             pays DNS + TLS to a third origin before it can even start the
             largest download on the page. -->
        <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

        <!--
          Structured data: Organization

          `sameAs` is what ties the social profiles to this entity rather than
          leaving them as three unrelated pages. It is hardcoded because this
          file is static, while the footer's links are admin-editable — so if
          somebody changes a social URL in Admin, change it here too. The URLs
          are deliberately clean: the LinkedIn one in the footer carries a
          ?viewAsMember tracking parameter that does not belong in an identity
          claim.

          logo is logo.jpg, not favicon.png. Google asks for an actual logo; a
          32px favicon is not one, and the knowledge panel shows what it is
          given.
        -->
        <!-- Structured data: Organization -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Oakbridge Publishing",
          "url": "https://www.oakbridge.in/",
          "logo": "https://www.oakbridge.in/logo.jpg",
          "foundingDate": "2017",
          "description": "A leading law and academic publishing house — law books, tax, business and academic titles, reference works, events, training and digital solutions.",
          "email": "info@oakbridge.in",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "info@oakbridge.in",
            "areaServed": "IN",
            "availableLanguage": ["English", "Hindi"]
          },
          "sameAs": [
            "https://www.linkedin.com/company/oakbridgepublishing/",
            "https://www.instagram.com/oakbridge.publishing/",
            "https://www.facebook.com/OakbridgePublishing/"
          ],
          "address": { "@type": "PostalAddress", "addressLocality": "Gurugram", "addressRegion": "Haryana", "addressCountry": "IN" }
        }
        </script>
        <!-- Structured data: WebSite + Sitelinks Search -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "Oakbridge Publishing",
          "url": "https://www.oakbridge.in/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": { "@type": "EntryPoint", "urlTemplate": "https://www.oakbridge.in/books?search={search_term_string}" },
            "query-input": "required name=search_term_string"
          }
        }
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
