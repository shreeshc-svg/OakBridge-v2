[pytest]
# Only collect the real suite in backend/tests.
#
# Without this, pytest's default discovery walks the whole backend/ tree and
# picks up any top-level file named test_*.py. That used to swallow
# check_email.py (then called test_email.py), a Resend diagnostic that sends a
# real email and expects an address in sys.argv -- so a plain `pytest` run
# would either error out or mail somebody. Diagnostics live at the backend
# root and are run by hand; tests live in tests/.
testpaths = tests
python_files = test_*.py
