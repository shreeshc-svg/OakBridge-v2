# Render Blueprint — Oakbridge backend (FastAPI).
# In Render: New → Blueprint → point at this repo. Set the `sync: false`
# vars in the dashboard (they're secrets / environment-specific).
services:
  - type: web
    name: oakbridge-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: "pip install -r requirements-local.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api
    autoDeploy: true
    # Persistent disk for uploaded covers / eBooks / media (served at /api/files/*).
    # Without this, uploads are wiped on every deploy.
    disk:
      name: storage
      mountPath: /var/data/storage
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DB_NAME
        value: oakbridge
      - key: SENDER_NAME
        value: Oakbridge Publishing
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret
      - key: TASK_TOKEN
        generateValue: true          # secret for the cart-reminders cron endpoint
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      # --- set these in the dashboard (secrets / environment-specific) ---
      - key: MONGO_URL              # Atlas SRV connection string
        sync: false
      - key: CORS_ORIGINS           # https://oakbridge.in,https://www.oakbridge.in
        sync: false
      - key: SITE_URL               # https://oakbridge.in
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD         # use the strong value from DEPLOYMENT.md
        sync: false
      - key: SENDER_EMAIL           # noreply@oakbridge.in (after domain verified)
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: LLM_API_KEY            # Groq key (gsk_...)
        sync: false
      # --- Phone OTP via MSG91 (SendOTP; signup verification) ---
      - key: MSG91_AUTHKEY          # MSG91 account auth key
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID  # DLT-approved SendOTP template id (SendOTP -> Templates)
        sync: false
      - key: MSG91_OTP_EXPIRY       # OTP validity in minutes
        value: "10"
      - key: MSG91_COUNTRY_CODE     # default country code for bare numbers
        value: "91"
      # --- Media storage on AWS S3 (private bucket; served via /api/files/*) ---
      - key: S3_BUCKET              # your S3 bucket name
        sync: false
      - key: S3_REGION              # e.g. ap-south-1 (Mumbai)
        sync: false
      - key: AWS_ACCESS_KEY_ID      # IAM user access key (secret)
        sync: false
      - key: AWS_SECRET_ACCESS_KEY  # IAM user secret key (secret)
        sync: false
