# Render Blueprint — Oakbridge backend (FastAPI).
# In Render: New → Blueprint → point at this repo. Set the `sync: false`
# vars in the dashboard (they're secrets / environment-specific).
services:
  - type: web
    name: oakbridge-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: "pip install -r requirements-local.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api
    autoDeploy: true
    # Persistent disk for uploaded covers / eBooks / media (served at /api/files/*).
    # Without this, uploads are wiped on every deploy.
    disk:
      name: storage
      mountPath: /var/data/storage
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DB_NAME
        value: oakbridge
      - key: SENDER_NAME
        value: Oakbridge Publishing
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret
      - key: TASK_TOKEN
        generateValue: true          # secret for the cart-reminders cron endpoint
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      # --- set these in the dashboard (secrets / environment-specific) ---
      - key: MONGO_URL              # Atlas SRV connection string
        sync: false
      - key: CORS_ORIGINS           # https://oakbridge.in,https://www.oakbridge.in
        sync: false
      - key: SITE_URL               # https://oakbridge.in
        sync: false
      # Public base for images in emails. Book covers are stored as
      # "/api/files/…" and a mail client cannot resolve a relative src, so
      # every cover renders broken without this. Must be the API host: Vercel
      # rewrites everything but /sitemap.xml to the SPA shell, so the same path
      # under SITE_URL returns HTML rather than a JPEG.
      - key: PUBLIC_API_URL
        value: https://api.oakbridge.in
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD         # use the strong value from DEPLOYMENT.md
        sync: false
      - key: SENDER_EMAIL           # noreply@oakbridge.in (after domain verified)
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: LLM_API_KEY            # Groq key (gsk_...)
        sync: false
      # --- Phone OTP via MSG91 (SendOTP; signup verification) ---
      - key: MSG91_AUTHKEY          # MSG91 account auth key
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID  # DLT-approved SendOTP template id (SendOTP -> Templates)
        sync: false
      - key: MSG91_OTP_EXPIRY       # OTP validity in minutes
        value: "10"
      - key: MSG91_COUNTRY_CODE     # default country code for bare numbers
        value: "91"
      # --- Media storage on AWS S3 (private bucket; served via /api/files/*) ---
      - key: S3_BUCKET              # your S3 bucket name
        sync: false
      - key: S3_REGION              # e.g. ap-south-1 (Mumbai)
        sync: false
      - key: AWS_ACCESS_KEY_ID      # IAM user access key (secret)
        sync: false
      - key: AWS_SECRET_ACCESS_KEY  # IAM user secret key (secret)
        sync: false

  # ---------------------------------------------------------------------------
  # Scheduled stock sync — Google Sheet -> website.
  #
  # SCHEDULE IS IN UTC. Render does not run cron in your local timezone, and
  # this is the single easiest thing to get wrong here. IST is UTC+5:30:
  #
  #     03:30 UTC  =  09:00 IST   (morning)
  #     12:30 UTC  =  18:00 IST   (evening)
  #
  # "1-6" is Monday to Saturday (0 = Sunday). One job, both times.
  #
  # If you change the times, convert first: subtract 5h30m from the IST time you
  # want. Anything up to 18:29 IST stays on the same UTC day; later than that and
  # the day-of-week field shifts too, which would silently move a Saturday run
  # onto Sunday.
  #
  # TASK_TOKEN must match the web service's value. It is `generateValue` there,
  # so Render will generate a DIFFERENT one here unless you copy it across in
  # the dashboard — the sync would then return 401 twice a day, forever. Either
  # paste the web service's value in, or move both to a shared environment group.
  - type: cron
    name: oakbridge-inventory-sync
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "30 3,12 * * 1-6"
    buildCommand: "echo no build needed"
    # --fail makes a 4xx/5xx exit non-zero, so a failed sync shows as a failed
    # run in Render rather than a green tick over a 401. --silent keeps the log
    # to the response body; --show-error still prints the reason when it breaks.
    startCommand: >-
      curl --fail --silent --show-error --max-time 120
      -X POST https://api.oakbridge.in/api/tasks/inventory-sync
      -H "X-Task-Token: $TASK_TOKEN"
    envVars:
      - key: TASK_TOKEN
        sync: false           # paste the SAME value as the web service
